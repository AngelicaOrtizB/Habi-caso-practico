spring.application.name=billetera

# Un monto como 100.5 debe rechazarse, no recortarse en silencio a 100.
spring.jackson.deserialization.accept-float-as-int=false
# Un campo mal escrito (ej. "monto" en vez de "montoCentavos") debe dar error, no ignorarse.
spring.jackson.deserialization.fail-on-unknown-properties=true
